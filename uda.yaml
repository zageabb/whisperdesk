schema_version: 1
application:
  name: whisperdesk
  display_name: WhisperDesk
  group: TAIJU - Development
source:
  branch: main
runtime:
  type: python
  version: "3.10.12"
  working_dir: .
build:
  working_dir: .
  commands:
    - ["python", "-m", "pip", "install", "-r", "requirements.txt"]
service:
  type: systemd
  entrypoint: ["gunicorn", "--workers", "1", "--threads", "4", "--timeout", "120", "--bind", "0.0.0.0:5084", "run:app"]
  port: 5084
  health_path: /health
proxy:
  enabled: true
  path: /apps/whisperdesk/
  authentication: uda
environment:
  required:
    - LOG_LEVEL
    - MAX_UPLOAD_MB
    - SECRET_KEY
    - WHISPERDESK_DATA_DIR
    - WHISPER_BEAM_SIZE
    - WHISPER_COMPUTE_TYPE
    - WHISPER_DEVICE
    - WHISPER_MODEL
    - WHISPER_VAD_FILTER
    - WHISPER_WORD_TIMESTAMPS
deployment:
  auto_update: true
  rollback: true
  github_reporting: false

